<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Skeletal System — Lab Exam Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #1E1A16;
    --surface: #262119;
    --surface-raised: #2E2820;
    --hairline: rgba(242,234,221,.10);
    --hairline-strong: rgba(242,234,221,.16);
    --control-border: rgba(242,234,221,.20);
    --ink: #F2EADD;
    --ink-70: rgba(242,234,221,.72);
    --ink-45: rgba(242,234,221,.45);
    --ink-30: rgba(242,234,221,.32);
    --accent: #E0A34A;
    --accent-wash: rgba(224,163,74,.12);
    --known: #8FBF9A;
    --known-text: #A8CFB1;
    --known-fill: #3E6B45;
    --tough: #DC8271;
    --tough-text: #E29A8B;
    --marker-red: #C0392B;
    --plate-bg: #FFFFFF;
    --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
    --font-sans: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100%;
    touch-action: manipulation;
  }

  body { padding: 20px 16px 56px; }

  button { font-family: inherit; }

  .shell { max-width: 1040px; margin: 0 auto; }

  .eyebrow-italic {
    font: italic 400 13.5px/1.4 var(--font-serif);
    color: var(--ink-45);
    margin-bottom: 5px;
  }
  .deck-title {
    font: 600 clamp(1.5rem, 4vw, 30px)/1.05 var(--font-serif);
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
  }
  .deck-subtitle {
    font: italic 400 13.5px/1.4 var(--font-serif);
    color: rgba(242,234,221,.55);
    display: block;
    margin-top: 5px;
  }

  /* ================= shared controls ================= */
  .pill-outline, .pill-primary, .tbtn {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 12.5px;
    border-radius: 6px;
    border: 1px solid var(--control-border);
    background: transparent;
    color: rgba(242,234,221,.8);
    cursor: pointer;
    padding: 9px 15px;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
    white-space: nowrap;
  }
  .pill-outline:hover, .tbtn:hover { border-color: var(--accent); color: var(--ink); }
  .pill-outline:disabled { opacity: .35; cursor: default; }
  .pill-outline:disabled:hover { border-color: var(--control-border); color: rgba(242,234,221,.8); }
  .pill-primary {
    border: none;
    background: var(--accent);
    color: var(--ground);
    font-weight: 600;
    font-size: 13px;
  }
  .pill-primary:hover { filter: brightness(1.06); }
  .pill-primary .keycap { font: 400 10.5px var(--font-mono); opacity: .6; margin-left: 6px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ================= study screen ================= */
  .study-header { padding-bottom: 0; }
  .header-row {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
    flex-wrap: wrap;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hairline-strong);
  }
  .header-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; min-width: 200px; }
  .counter { font: 500 13px var(--font-mono); letter-spacing: .04em; color: var(--ink-70); }
  .counter .of { color: rgba(242,234,221,.34); }
  .progress-track { display: flex; width: 200px; max-width: 100%; height: 3px; background: rgba(242,234,221,.14); border-radius: 2px; overflow: hidden; }
  .progress-seg { height: 100%; width: 0%; }
  .progress-seg.known { background: var(--known); }
  .progress-seg.tough { background: var(--tough); }
  .tally { display: flex; gap: 13px; font: 500 10.5px var(--font-mono); letter-spacing: .06em; }
  .tally .known { color: var(--known); }
  .tally .tough { color: var(--tough); }

  .toolbar { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin: 16px 0 18px; }
  .tbtn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; }
  .tbtn[data-active="true"] {
    border-color: rgba(143,191,154,.45);
    background: rgba(143,191,154,.14);
    color: var(--known-text);
    font-weight: 600;
  }
  .tough-toggle[data-active="true"] {
    border-color: rgba(220,130,113,.55);
    background: rgba(220,130,113,.18);
    color: var(--tough-text);
    font-weight: 600;
    box-shadow: 0 0 0 1px rgba(220,130,113,.3) inset;
  }
  .tough-toggle[data-active="true"] .tough-dot { background: var(--tough-text); }
  .hamburger { display: flex; flex-direction: column; gap: 3px; }
  .hamburger span { width: 12px; height: 1.5px; background: currentColor; display: block; }
  .tough-dot { width: 7px; height: 7px; border-radius: 9px; background: var(--tough); flex: none; }
  .tbtn .count { font: 500 11px var(--font-mono); color: var(--ink-45); }
  .toolbar .spacer { flex: 1; }

  .segmented {
    display: flex; height: 38px; border: 1px solid var(--control-border); border-radius: 6px; overflow: hidden;
  }
  .segmented button {
    background: none; border: none; cursor: pointer;
    padding: 0 14px; font: 500 13px var(--font-sans); color: rgba(242,234,221,.6);
    border-left: 1px solid rgba(242,234,221,.14);
  }
  .segmented button:first-child { border-left: none; }
  .segmented button[aria-selected="true"] { background: var(--accent); color: var(--ground); font-weight: 600; }
  .segmented button:hover:not([aria-selected="true"]) { color: var(--ink); }

  .study-body { display: grid; grid-template-columns: 270px minmax(0,1fr); gap: 18px; align-items: start; }
  @media (max-width: 899px) { .study-body { display: block; } }

  .rail {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 16px 14px;
    align-self: flex-start;
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }
  .rail-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 11px; }
  .rail-head h2 { margin: 0; font: 600 16px var(--font-serif); color: var(--ink); }
  .rail-actions { display: flex; gap: 4px; }
  .rail-actions button {
    background: none; border: none; cursor: pointer;
    font: 500 10.5px var(--font-mono); letter-spacing: .05em;
    padding: 3px 6px; border-radius: 4px; color: var(--ink-45);
  }
  .rail-actions button:hover { background: var(--hairline); color: rgba(242,234,221,.7); }

  .cat-list { display: flex; flex-direction: column; gap: 1px; }
  .cat-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 7px; border-radius: 5px; cursor: pointer;
  }
  .cat-row.selected { background: var(--accent-wash); box-shadow: inset 2px 0 0 var(--accent); }
  .cat-name { flex: 1; font: 500 12.5px/1.3 var(--font-sans); color: rgba(242,234,221,.82); }
  .cat-row.selected .cat-name { font-weight: 600; color: var(--ink); }
  .cat-num { font: 500 11px var(--font-mono); color: var(--ink-45); flex: none; }
  .cat-row.selected .cat-num { color: var(--accent); }
  .chevron-btn { background: none; border: none; cursor: pointer; color: var(--ink-45); font: 700 19px var(--font-sans); padding: 0 4px; line-height: 1; flex: none; }
  .chevron-btn:hover { color: var(--accent); }

  input[type=checkbox].cat-check {
    appearance: none; -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 3px;
    border: 1.5px solid rgba(242,234,221,.3);
    background: transparent; position: relative; flex: none; cursor: pointer; margin: 0;
  }
  input[type=checkbox].cat-check.sub { width: 12px; height: 12px; border-color: rgba(242,234,221,.26); }
  input[type=checkbox].cat-check:checked, input[type=checkbox].cat-check:indeterminate {
    background: var(--accent); border-color: var(--accent);
  }
  input[type=checkbox].cat-check:checked::after {
    content: '\2713'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: var(--ground);
  }

  .sub-list {
    display: flex; flex-direction: column; gap: 0;
    margin: 2px 0 8px 20px; padding-left: 11px;
    border-left: 1px solid rgba(242,234,221,.14);
  }
  .sub-row-item { padding: 5px 5px; }
  .sub-row-item .cat-name { font: 400 12px var(--font-sans); color: rgba(242,234,221,.7); }
  .sub-row-item .cat-num { font: 400 10.5px var(--font-mono); color: var(--ink-30); }

  .backdrop { display: none; }
  @media (max-width: 899px) {
    .rail {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 82vw; max-width: 300px; border-radius: 0;
      max-height: none;
      transform: translateX(-100%);
      transition: transform .25s ease;
      z-index: 60;
    }
    .rail.open { transform: translateX(0); }
    .backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 55; }
  }

  /* ---------- card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 20px 22px 18px;
    min-height: 320px;
  }
  .card.is-correct { border-color: rgba(143,191,154,.30); }
  .card.is-incorrect { border-color: rgba(220,130,113,.30); }

  .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .meta-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .eyebrow-chip {
    padding: 5px 10px; border-radius: 4px; background: rgba(242,234,221,.09);
    font: 600 10.5px var(--font-mono); letter-spacing: .08em; color: var(--accent);
  }
  .result-chip { padding: 5px 10px; border-radius: 4px; font: 600 10.5px var(--font-mono); letter-spacing: .08em; }
  .result-chip.correct { background: rgba(143,191,154,.16); color: var(--known-text); }
  .result-chip.incorrect { background: rgba(220,130,113,.16); color: var(--tough-text); }
  .grade-btns { display: flex; gap: 7px; }
  .grade {
    padding: 6px 12px; border-radius: 5px; background: none; cursor: pointer;
    font: 600 11.5px var(--font-sans);
  }
  .grade.easy { border: 1px solid rgba(143,191,154,.4); color: var(--known-text); }
  .grade.easy[aria-pressed="true"] { background: rgba(143,191,154,.18); border-color: rgba(143,191,154,.5); }
  .grade.tough { border: 1px solid rgba(220,130,113,.4); color: var(--tough-text); }
  .grade.tough[aria-pressed="true"] { background: rgba(220,130,113,.18); border-color: rgba(220,130,113,.5); }

  .prompt { font: 400 17.6px/1.4 var(--font-serif); color: var(--ink); margin-bottom: 16px; }
  .prompt.dim { color: rgba(242,234,221,.6); }

  .plate-well {
    position: relative; width: 620px; max-width: 100%;
    border-radius: 6px; overflow: hidden; background: var(--plate-bg);
    margin: 0 auto 16px;
  }
  .plate-well img { display: block; width: 100%; height: auto; }
  .plate-well .term-target div {
    background: var(--known) !important;
    border: 2px solid var(--known) !important;
    border-radius: 5px !important;
    box-shadow: 0 0 0 5px rgba(143,191,154,.25) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  .plate-well .term-target div:not(.term-star)::after {
    content: '?';
    font: 700 15px var(--font-sans);
    color: var(--ground);
  }
  .plate-well .term-target .term-star { display: none !important; }
  .overlay-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .overlay-svg rect, .overlay-svg circle { fill: none; stroke: var(--marker-red); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .overlay-svg line, .overlay-svg polyline { stroke: var(--marker-red); stroke-width: 3; fill: none; vector-effect: non-scaling-stroke; }

  .answer-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .answer-term { font: 600 26px var(--font-serif); color: var(--ink); }
  .result-icon { font-size: 22px; font-weight: 700; }
  .result-icon.correct { color: var(--known-text); }
  .result-icon.incorrect { color: var(--marker-red); }
  .mnemonic { font: italic 400 13.5px var(--font-serif); color: var(--known-text); margin-top: 2px; }
  .marker-note { font-style: italic; color: var(--marker-red); }

  .answer-row { display: flex; gap: 10px; margin-top: 16px; }
  .answer-input-wrap { position: relative; flex: 1; }
  .answer-input-wrap input {
    width: 100%; height: 50px; box-sizing: border-box;
    border: 1px solid var(--control-border); border-radius: 6px;
    background: transparent; color: var(--ink);
    font: 400 16px var(--font-sans); padding: 0 66px 0 15px;
  }
  .answer-input-wrap input::placeholder { color: var(--ink-30); }
  .answer-input-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224,163,74,.18); }
  .answer-input-wrap input.correct { border-color: var(--known); }
  .answer-input-wrap input.incorrect { border-color: var(--tough); }
  .answer-input-wrap .kbd-hint {
    position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    font: 400 12px var(--font-mono); color: var(--ink-30); pointer-events: none;
  }
  .check-btn {
    flex: none; width: 112px; height: 50px; border: none; border-radius: 6px;
    background: var(--accent); color: var(--ground); font: 600 15px var(--font-sans); cursor: pointer;
  }
  .check-btn:hover { filter: brightness(1.06); }
  .check-btn:disabled { opacity: .5; cursor: default; }

  .show-answer-row { margin-top: 16px; text-align: center; }

  .mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  @media (max-width: 480px) { .mc-grid { grid-template-columns: 1fr; } }
  .mc-option {
    font: 400 14px var(--font-sans); text-align: left; padding: 12px 14px;
    border: 1px solid var(--control-border); border-radius: 6px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  .mc-option:hover:not(:disabled) { border-color: var(--accent); }
  .mc-option:disabled { cursor: default; }
  .mc-option.correct { border-color: var(--known); background: rgba(143,191,154,.12); color: var(--known-text); font-weight: 600; }
  .mc-option.incorrect { border-color: var(--tough); background: rgba(220,130,113,.12); color: var(--tough-text); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-45); }
  .empty-state h2 { font: 600 1.2rem var(--font-serif); color: var(--ink); margin-bottom: 8px; }

  .card-footer {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--hairline);
  }
  .footer-nav { display: flex; gap: 8px; }
  .session-note { font: 400 12px var(--font-sans); color: rgba(242,234,221,.35); }

  .hint { text-align: center; font: 400 11px var(--font-sans); color: rgba(242,234,221,.35); margin-top: 20px; }
  .hint .keycap {
    font: 500 10.5px var(--font-mono); padding: 3px 6px; border: 1px solid rgba(242,234,221,.18);
    border-radius: 4px; margin: 0 6px 0 0;
  }
  .hint span + span { margin-left: 16px; }

  /* ================= mobile study screen ================= */
  .mobile-shell { display: none; }
  @media (max-width: 700px) {
    .shell { display: none; }
    .mobile-shell {
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0;
      background: var(--ground);
      z-index: 10;
    }
  }

  .mobile-topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 16px 10px; flex: none;
  }
  .mobile-icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--ink); padding: 6px; line-height: 0; flex: none;
  }
  .mobile-counter {
    margin-left: auto;
    font: 500 13px var(--font-mono); color: var(--ink-70); letter-spacing: .04em; flex: none;
  }
  .mobile-segbar-row { display: flex; gap: 3px; padding: 0 16px 14px; flex: none; }
  .mobile-seg { flex: 1; height: 4px; border-radius: 3px; background: rgba(242,234,221,.14); }
  .mobile-seg.known { background: var(--known); }
  .mobile-seg.tough { background: var(--tough); }
  .mobile-seg.current { background: var(--accent); }

  .mobile-body {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 0 16px 110px;
  }
  .mobile-nav-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0 14px;
  }
  .mobile-navlink {
    background: none; border: none; cursor: pointer;
    font: 500 12.5px var(--font-sans); color: var(--ink-45); padding: 4px 0;
  }
  .mobile-navlink:hover { color: var(--accent); }
  .mobile-eyebrow-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

  .mobile-body .prompt { font-size: 15.2px; }
  .mobile-body .plate-well {
    width: calc(100% + 32px);
    margin-left: -16px; margin-right: -16px;
    max-width: none; border-radius: 0;
    margin-bottom: 16px;
  }
  .mobile-body .answer-row { flex-direction: column; }
  .mobile-body .check-btn { width: 100%; }
  .mobile-body .mc-grid { grid-template-columns: 1fr; }
  .mobile-body .show-answer-row .pill-primary { width: 100%; }

  .mobile-grade-row {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; gap: 10px;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--ground) 65%, transparent);
    z-index: 5;
  }
  .mobile-grade-btn {
    flex: 1; height: 52px; border-radius: 10px; cursor: pointer;
    font: 600 14.5px var(--font-sans);
  }
  .mobile-grade-btn.tough {
    background: rgba(220,130,113,.14); border: 1px solid rgba(220,130,113,.45); color: var(--tough-text);
  }
  .mobile-grade-btn.easy {
    background: var(--known); border: none; color: var(--ground); flex: 1.3;
  }

  .mobile-sheet-backdrop { display: none; }
  .mobile-sheet-backdrop.show {
    display: block; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20;
  }
  .mobile-sheet {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 84vw; max-width: 320px;
    background: var(--surface);
    transform: translateX(-100%);
    transition: transform .25s ease;
    z-index: 21;
    overflow-y: auto;
    padding: 18px 16px;
  }
  .mobile-sheet.open { transform: translateX(0); }
  .mobile-sheet-section { margin-bottom: 20px; }
  .mobile-sheet-section .segmented { width: 100%; height: auto; flex-direction: column; }
  .mobile-sheet-section .segmented button {
    padding: 12px 14px; text-align: left; border-left: none;
    border-top: 1px solid rgba(242,234,221,.14);
  }
  .mobile-sheet-section .segmented button:first-child { border-top: none; }
  .mobile-sheet-actions { display: flex; flex-direction: column; gap: 8px; }
  .mobile-sheet-actions .tbtn { width: 100%; justify-content: flex-start; }

  /* ================= box editor (author-only content tool) ================= */
  #app.editor-active .shell, #app.editor-active .mobile-shell { display: none !important; }
  .editor-entry-btn { position: fixed; bottom: 18px; right: 18px; z-index: 80; }
  .editor-shell { max-width: 1240px; margin: 0 auto; padding: 20px 16px 56px; }
  .editor-topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .editor-topbar h1 { font: 600 22px var(--font-serif); margin: 0; color: var(--ink); }
  .editor-save-note { font: 400 12px var(--font-sans); color: var(--ink-45); }
  .editor-body { display: grid; grid-template-columns: 220px minmax(0,1fr) 300px; gap: 18px; align-items: start; }
  .editor-panel { background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px; padding: 14px; }
  .editor-image-list { display: flex; flex-direction: column; gap: 2px; max-height: 74vh; overflow: auto; }
  .editor-image-list button {
    display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
    background: transparent; border: none; border-radius: 5px; padding: 8px 9px; cursor: pointer;
    font: 500 12.5px var(--font-sans); color: var(--ink-70);
  }
  .editor-image-list button:hover { background: var(--surface-raised); color: var(--ink); }
  .editor-image-list button[aria-pressed="true"] { background: var(--accent-wash); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
  .editor-image-list .prog { font: 500 11px var(--font-mono); color: var(--ink-45); }
  .editor-image-list button.all-done .prog { color: var(--known-text); }
  .editor-canvas-wrap {
    position: relative; width: 100%; max-width: 900px; margin: 0 auto;
    background: var(--plate-bg); border-radius: 6px; overflow: hidden; cursor: crosshair; user-select: none;
  }
  .editor-canvas-wrap img { display: block; width: 100%; height: auto; pointer-events: none; }
  .editor-box { position: absolute; box-sizing: border-box; background: rgba(255,235,59,.30); border: 2px solid #ffeb3b; }
  .editor-box.is-selected { background: rgba(224,163,74,.35); border-color: var(--accent); }
  .editor-box .box-del {
    position: absolute; top: -9px; right: -9px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--marker-red); color: #fff; font: 700 11px var(--font-sans); line-height: 18px;
    text-align: center; cursor: pointer; box-shadow: 0 0 0 2px var(--ground);
  }
  .editor-draw-rect { position: absolute; border: 2px dashed var(--accent); background: rgba(224,163,74,.18); pointer-events: none; }
  .editor-hint { font: 400 12px var(--font-sans); color: var(--ink-45); margin-top: 10px; text-align: center; }
  .editor-card-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .editor-card-count { font: 500 12px var(--font-mono); color: var(--ink-45); }
  .editor-card-cat { font: 600 10.5px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .editor-card-def { font: 400 15px/1.5 var(--font-serif); color: var(--ink); margin-bottom: 10px; }
  .editor-card-term { font: 600 18px var(--font-serif); color: var(--known-text); margin-bottom: 14px; }
  .editor-card-status { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--font-mono); padding: 4px 9px; border-radius: 5px; margin-bottom: 12px; }
  .editor-card-status.done { background: rgba(143,191,154,.16); color: var(--known-text); }
  .editor-card-status.pending { background: rgba(220,130,113,.14); color: var(--tough-text); }
  .editor-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .editor-actions .tbtn, .editor-actions .pill-primary, .editor-actions .pill-outline { width: 100%; justify-content: center; }
  @media (max-width: 900px) { .editor-body { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="shell">
      <header class="study-header">
        <div class="header-row">
          <div>
            <h1 class="deck-title">Skeletal System</h1>

        <button class="tbtn tough-toggle" id="toughOnlyBtn" title="Show only cards marked tough">

          <button type="button" data-mode="mc" role="tab">Multiple Choice</button>
          <button type="button" data-mode="quick" role="tab">Quick Study</button>
          <button type="button" data-mode="imageonly" role="tab">Image Only</button>

        <button class="tbtn tough-toggle" id="toughOnlyBtnMobile" title="Show only cards marked tough">
          <span class="tough-dot"></span>Review tough <span class="count"></span>

    <div class="mobile-body" id="mobileBody"></div>
  </div>

  <div id="editorRoot" style="display:none"></div>

</div>

<script>
const IMAGES = __IMAGES_JSON__;
const CARDS = __CARDS_JSON__;

const STORAGE_KEY = 'apSkeletalLabGuide.state.v3';
const ALL_CATEGORIES = [...new Set(CARDS.map(c => c.category))].sort((a, b) => a.localeCompare(b));

// Broader groupings so related categories can be toggled together.
// "Histology" catches anything not explicitly placed in another bucket.
const BUCKET_DEFS = [
  {
    name: 'Vertebral Column and Thorax',
    categories: [
      'Vertebral Column - Regions', 'Typical Vertebra', 'Cervical Vertebrae - Unique Features',
      'Thoracic Vertebrae - Unique Features', 'Sternum', 'Ribs',
    ],
  },
  {
    name: 'Cranium (Skull)',
    categories: [
      'Cranium - Sutures', 'Cranial Bones', 'Temporal Bone', 'Facial Bones', 'Ethmoid Bone',
      'Frontal Bone', 'Occipital Bone', 'Sphenoid Bone', 'Maxilla', 'Mandible', 'Hyoid Bone',
    ],
  },
  {
    name: 'General Osteology',
    categories: [
      'Divisions of the Skeleton', 'Types of Bones (Shape)', 'Parts of a Long Bone',
      'Long Bone Growth Zones', 'Bony Markings',
    ],
  },
  {
    name: 'Pectoral Girdle & Upper Limb',
    categories: [
      'Pectoral Girdle & Upper Limb Bones', 'Scapula', 'Humerus', 'Radius', 'Ulna', 'Carpals',
    ],
  },
  {
    name: 'Pelvic Girdle & Lower Limb',
    categories: [
      'Pelvic Girdle & Lower Limb Bones', 'Coxal Bone', 'Ilium', 'Ischium', 'Femur', 'Tibia',
      'Fibula', 'Tarsals', 'Knee Joint',
    ],
  },
  {
    name: 'Muscular System',
    categories: [
      'Muscle — Connective Tissue & Hierarchy', 'Muscle — Fiber Anatomy', 'Muscle — Sarcomere',
      'Muscle — Filament Proteins', 'Muscle — Neuromuscular Junction',
      'Muscle — E-C Coupling & Cross-Bridge Cycle', 'Muscle — Motor Units & Force',
      'Muscle — Energy & Fiber Types', 'Muscle — Muscle Tissue Types', 'Muscle — Fatigue & EMG',
      'Muscle — Clinical Correlates',
    ],
  },
];
// New buckets that should start OFF for first-time visitors (still toggleable
// on manually) — currently just the muscular system deck, kept separate from
// the original skeletal lab exam guide.
const BUCKETS_OFF_BY_DEFAULT = new Set(['Muscular System']);
const bucketedSoFar = new Set(BUCKET_DEFS.flatMap(b => b.categories));
const histologyCats = ALL_CATEGORIES.filter(c => !bucketedSoFar.has(c));
const BUCKETS = [
  ...BUCKET_DEFS.map(b => ({ name: b.name, categories: b.categories.filter(c => ALL_CATEGORIES.includes(c)) })),
  { name: 'Histology', categories: histologyCats },
].filter(b => b.categories.length);
const categoriesOffByDefault = new Set(
  BUCKETS.filter(b => BUCKETS_OFF_BY_DEFAULT.has(b.name)).flatMap(b => b.categories)
);
const DEFAULT_ACTIVE_CATEGORIES = ALL_CATEGORIES.filter(c => !categoriesOffByDefault.has(c));

let marks = {}; // id -> 'easy' | 'hard'
let prefs = {
  mode: 'typein',
  activeCategories: DEFAULT_ACTIVE_CATEGORIES.slice(),
  hideEasy: true,
  toughOnly: false,
  expandedBuckets: [],
};

function loadStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.marks && typeof data.marks === 'object') marks = data.marks;
    if (data.prefs) {
      Object.assign(prefs, data.prefs);
      if (Array.isArray(prefs.activeCategories)) {
        prefs.activeCategories = prefs.activeCategories.filter(c => ALL_CATEGORIES.includes(c));
        if (!prefs.activeCategories.length) prefs.activeCategories = DEFAULT_ACTIVE_CATEGORIES.slice();
      } else {
        prefs.activeCategories = DEFAULT_ACTIVE_CATEGORIES.slice();
      }
      if (Array.isArray(prefs.expandedBuckets)) {
        const bucketNames = new Set(BUCKETS.map(b => b.name));
        prefs.expandedBuckets = prefs.expandedBuckets.filter(n => bucketNames.has(n));
      } else {
        prefs.expandedBuckets = [];
      }
    }
  } catch (e) { /* storage unavailable; keep defaults */ }
}
function saveStorage() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ marks, prefs })); } catch (e) { /* ignore */ }
}
loadStorage();

const MOBILE_QUERY = window.matchMedia('(max-width: 700px)');
function isMobile() { return MOBILE_QUERY.matches; }

const state = {
  order: [],
  pos: 0,
  revealed: false,
  mc: null,          // { options: [{text, correct}], selectedIndex }
  typedValue: '',
  typedChecked: false,
  typedCorrect: false,
};

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function currentPool() {
  return CARDS.filter(c => {
    if (!prefs.activeCategories.includes(c.category)) return false;
    const mark = marks[c.id];
    if (prefs.toughOnly && mark !== 'hard') return false;
    if (prefs.hideEasy && mark === 'easy') return false;
    return true;
  });
}

function rebuildOrder(preserveOrder) {
  const pool = currentPool();
  const ids = pool.map(c => c.id);
  const currentId = state.order[state.pos];
  if (preserveOrder && state.order.length) {
    const idSet = new Set(ids);
    const kept = state.order.filter(id => idSet.has(id));
    const missing = ids.filter(id => !kept.includes(id));
    state.order = kept.concat(missing);
  } else {
    state.order = ids;
  }
  let newPos;
  if (currentId !== undefined && state.order.includes(currentId)) {
    newPos = state.order.indexOf(currentId);
  } else {
    newPos = Math.min(state.pos, Math.max(state.order.length - 1, 0));
  }
  // A filter/mark change can silently swap in a different card at the same
  // position (e.g. the current card got hidden by "Hide easy") — clear any
  // in-progress answer/MC state so it doesn't get shown against the wrong card.
  if (state.order[newPos] !== currentId) resetInteraction();
  state.pos = newPos;
}

function resetInteraction() {
  state.revealed = false;
  state.mc = null;
  state.typedValue = '';
  state.typedChecked = false;
  state.typedCorrect = false;
}

function shuffleOrder() {
  state.order = shuffleArray(state.order);
  state.pos = 0;
  resetInteraction();
  render();
}

function getCardById(id) { return CARDS.find(c => c.id === id); }

function escapeAttr(s) { return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }
function escapeHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function normalize(s) { return (s || '').trim().toLowerCase().replace(/\s+/g, ' '); }

function renderOcclusionImage(card, revealed) {
  const src = IMAGES[card.image] || '';
  const base = (card.blockers || '') + (card.whiteout || '');
  const targetHtml = revealed ? '' : `<div class="term-target">${card.termCss || ''}</div>`;
  return `<div class="plate-well">
    <img src="${src}" alt="Diagram for ${escapeAttr(card.category)}">
    ${base}
    ${targetHtml}
  </div>`;
}
function renderMarkerImage(card) {
  const src = IMAGES[card.image] || '';
  return `<div class="plate-well">
    <img src="${src}" alt="Diagram for ${escapeAttr(card.category)}">
    <svg class="overlay-svg" viewBox="0 0 100 100" preserveAspectRatio="none">${card.marker || ''}</svg>
  </div>`;
}
function renderImage(card, revealed) {
  if (!card.image) return '';
  return card.type === 'occlusion' ? renderOcclusionImage(card, revealed) : renderMarkerImage(card);
}

function fitPlateWell(area) {
  const img = area.querySelector('.plate-well img');
  if (!img) return;
  const wrap = img.closest('.plate-well');
  const apply = () => { if (img.naturalWidth) wrap.style.maxWidth = Math.min(620, img.naturalWidth) + 'px'; };
  if (img.complete) apply(); else img.addEventListener('load', apply, { once: true });
}

function findBucketForCategory(cat) {
  return BUCKETS.find(b => b.categories.includes(cat));
}

function buildMcOptions(card) {
  const correct = card.term;
  const seen = new Set([normalize(correct)]);
  const bucket = findBucketForCategory(card.category);
  const bucketCategories = bucket ? new Set(bucket.categories) : new Set([card.category]);

  function collect(predicate) {
    const out = [];
    for (const c of CARDS) {
      if (c.id === card.id) continue;
      if (!predicate(c)) continue;
      const t = c.term;
      if (!t) continue;
      const key = normalize(t);
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(t);
    }
    return out;
  }

  let distractors = shuffleArray(collect(c => bucketCategories.has(c.category))).slice(0, 3);
  if (distractors.length < 3) {
    const extra = shuffleArray(collect(() => true));
    for (const t of extra) {
      if (distractors.length >= 3) break;
      distractors.push(t);
    }
  }

  const options = [correct, ...distractors].map(text => ({ text, correct: text === correct }));
  return shuffleArray(options);
}

function categoryCount(cat) { return CARDS.filter(c => c.category === cat).length; }

/* ---------- Sidebar (study screen) ---------- */
function bucketState(bucket) {
  const total = bucket.categories.length;
  const activeCount = bucket.categories.filter(c => prefs.activeCategories.includes(c)).length;
  if (activeCount === 0) return 'none';
  if (activeCount === total) return 'all';
  return 'some';
}

function toggleBucket(bucket) {
  const set = new Set(prefs.activeCategories);
  if (bucketState(bucket) === 'all') {
    bucket.categories.forEach(c => set.delete(c));
  } else {
    bucket.categories.forEach(c => set.add(c));
  }
  prefs.activeCategories = [...set];
  saveStorage();
  rebuildOrder(true);
  render();
}

function toggleExpanded(bucketName) {
  const set = new Set(prefs.expandedBuckets);
  if (set.has(bucketName)) set.delete(bucketName); else set.add(bucketName);
  prefs.expandedBuckets = [...set];
  saveStorage();
  renderSidebar();
}

function renderSidebar() {
  renderCategoryListInto(document.getElementById('catList'));
  renderCategoryListInto(document.getElementById('catListMobile'));
}

function renderCategoryListInto(list) {
  list.innerHTML = '';
  for (const bucket of BUCKETS) {
    const total = bucket.categories.reduce((sum, c) => sum + categoryCount(c), 0);
    const bState = bucketState(bucket);
    const expanded = prefs.expandedBuckets.includes(bucket.name);

    const row = document.createElement('div');
    row.className = 'cat-row' + (bState === 'all' ? ' selected' : '');
    row.style.display = 'flex';
    row.innerHTML = `
      <input type="checkbox" class="cat-check bucket-check" data-bucket="${escapeAttr(bucket.name)}" ${bState === 'all' ? 'checked' : ''}>
      <span class="cat-name">${escapeHtml(bucket.name)}</span>
      <span class="cat-num">${total}</span>
      <button type="button" class="chevron-btn" data-bucket="${escapeAttr(bucket.name)}" title="Show subcategories">${expanded ? '▾' : '▸'}</button>
    `;
    const bucketCheck = row.querySelector('.bucket-check');
    bucketCheck.indeterminate = (bState === 'some');
    bucketCheck.addEventListener('click', (e) => e.stopPropagation());
    bucketCheck.addEventListener('change', () => toggleBucket(bucket));
    row.querySelector('.chevron-btn').addEventListener('click', () => toggleExpanded(bucket.name));
    list.appendChild(row);

    if (expanded) {
      const sub = document.createElement('div');
      sub.className = 'sub-list';
      for (const cat of bucket.categories) {
        const count = categoryCount(cat);
        const checked = prefs.activeCategories.includes(cat);
        const item = document.createElement('label');
        item.className = 'cat-row sub-row-item';
        item.innerHTML = `<input type="checkbox" class="cat-check sub" data-cat="${escapeAttr(cat)}" ${checked ? 'checked' : ''}>
          <span class="cat-name">${escapeHtml(cat)}</span>
          <span class="cat-num">${count}</span>`;
        sub.appendChild(item);
      }
      sub.querySelectorAll('input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', (e) => {
          const cat = e.target.getAttribute('data-cat');
          const set = new Set(prefs.activeCategories);
          if (e.target.checked) set.add(cat); else set.delete(cat);
          prefs.activeCategories = [...set];
          saveStorage();
          rebuildOrder(true);
          render();
        });
      });
      list.appendChild(sub);
    }
  }
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

/* ---------- Card rendering per mode ---------- */
function gradeButtonsHtml(card) {
  const mark = marks[card.id];
  return `<div class="grade-btns">
    <button class="grade easy" id="easyBtn" aria-pressed="${mark === 'easy'}" title="Mark easy (E)">Easy</button>
    <button class="grade tough" id="hardBtn" aria-pressed="${mark === 'hard'}" title="Mark tough (H)">Tough</button>
  </div>`;
}

function definitionHtml(card) {
  if (prefs.mode === 'imageonly') return '';
  const promptClass = state.revealed ? 'prompt dim' : 'prompt';
  const hasRedMarker = card.type === 'marker' && card.marker && card.marker.trim();
  const note = hasRedMarker ? ' <em class="marker-note">Indicated by red</em>' : '';
  return `<div class="${promptClass}">${card.definition}${note}</div>`;
}

function computeResultInfo() {
  if (state.revealed && prefs.mode === 'typein') {
    return state.typedCorrect
      ? { chip: 'correct', label: 'CORRECT' }
      : { chip: 'incorrect', label: 'INCORRECT' };
  }
  if (state.revealed && prefs.mode === 'mc' && state.mc) {
    const gotIt = state.mc.selectedIndex !== null && state.mc.options[state.mc.selectedIndex]?.correct;
    return gotIt ? { chip: 'correct', label: 'CORRECT' } : { chip: 'incorrect', label: 'INCORRECT' };
  }
  return null;
}

function renderCard() {
  const area = document.getElementById('cardArea');
  const card = getCardById(state.order[state.pos]);

  const result = computeResultInfo();
  const resultChip = result ? `<span class="result-chip ${result.chip}">${result.label}</span>` : '';
  const cardStateClass = result ? (result.chip === 'correct' ? ' is-correct' : ' is-incorrect') : '';

  const topHtml = `
    <div class="card-meta">
      <div class="meta-left"><span class="eyebrow-chip">${escapeHtml(card.category)}</span>${resultChip}</div>
      ${gradeButtonsHtml(card)}
    </div>`;
  const defHtml = definitionHtml(card);
  const imageHtml = renderImage(card, state.revealed);

  let bottomHtml = '';
  if (prefs.mode === 'typein') {
    bottomHtml = renderTypeInBottom(card);
  } else if (prefs.mode === 'mc') {
    bottomHtml = renderMcBottom(card);
  } else {
    bottomHtml = renderFlipBottom(card);
  }

  const nextIsPrimary = state.revealed;
  const footerHtml = `
    <div class="card-footer">
      <div class="footer-nav">
        <button class="pill-outline" id="prevBtn">&lsaquo; Prev</button>
        <button class="${nextIsPrimary ? 'pill-primary' : 'pill-outline'}" id="nextBtn">${nextIsPrimary ? 'Next card <span class="keycap">space</span>' : 'Next &rsaquo;'}</button>
      </div>
    </div>`;

  area.innerHTML = `<div class="card${cardStateClass}">${topHtml}${defHtml}${imageHtml}${bottomHtml}${footerHtml}</div>`;
  fitPlateWell(area);
  attachCardHandlers(card);
}

function renderFlipBottom(card) {
  if (!state.revealed) {
    return `<div class="show-answer-row"><button class="pill-primary" id="showAnswerBtn" style="width:100%;height:50px">Show Answer</button></div>`;
  }
  return `
    <div class="answer-line">
      <span class="answer-term">${escapeHtml(card.term)}</span>
    </div>
    ${card.mnemonic ? `<div class="mnemonic">${card.mnemonic}</div>` : ''}
  `;
}

function renderTypeInBottom(card) {
  if (!state.revealed) {
    return `
      <div class="answer-row">
        <div class="answer-input-wrap">
          <input type="text" id="typeInput" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" spellcheck="false" value="${escapeAttr(state.typedValue)}">
          <span class="kbd-hint">&crarr; to check</span>
        </div>
        <button class="check-btn" id="checkBtn">Check</button>
      </div>
    `;
  }
  const markIcon = state.typedCorrect
    ? '<span class="result-icon correct">&#10003;</span>'
    : '<span class="result-icon incorrect">&#10007;</span>';
  return `
    <div class="answer-line">
      <span class="answer-term">${escapeHtml(card.term)}</span>
      ${markIcon}
      ${!state.typedCorrect ? `<span style="font:400 12.5px 'Work Sans',sans-serif;color:var(--ink-45)">you typed: <em>${escapeHtml(state.typedValue) || '(nothing)'}</em></span>` : ''}
    </div>
    ${card.mnemonic ? `<div class="mnemonic">${card.mnemonic}</div>` : ''}
  `;
}

function renderMcBottom(card) {
  if (!state.mc) state.mc = { options: buildMcOptions(card), selectedIndex: null };
  const opts = state.mc.options;
  const optsHtml = opts.map((opt, i) => {
    let cls = '';
    if (state.revealed) {
      if (opt.correct) cls = 'correct';
      else if (i === state.mc.selectedIndex) cls = 'incorrect';
    }
    return `<button class="mc-option ${cls}" data-idx="${i}" ${state.revealed ? 'disabled' : ''}>${escapeHtml(opt.text)}</button>`;
  }).join('');
  let reveal = '';
  if (state.revealed && card.mnemonic) {
    reveal = `<div class="mnemonic" style="margin-top:14px">${card.mnemonic}</div>`;
  }
  return `<div class="mc-grid">${optsHtml}</div>${reveal}`;
}

function renderMobileSegbar() {
  const bar = document.getElementById('mobileSegbar');
  bar.innerHTML = state.order.map((id, i) => {
    let cls = 'mobile-seg';
    if (i === state.pos) cls += ' current';
    else if (marks[id] === 'easy') cls += ' known';
    else if (marks[id] === 'hard') cls += ' tough';
    return `<div class="${cls}"></div>`;
  }).join('');
}

function renderMobileBody() {
  const body = document.getElementById('mobileBody');
  const card = getCardById(state.order[state.pos]);

  const result = computeResultInfo();
  const resultChip = result ? `<span class="result-chip ${result.chip}">${result.label}</span>` : '';

  const defHtml = definitionHtml(card);
  const imageHtml = renderImage(card, state.revealed);

  let bottomHtml = '';
  if (prefs.mode === 'typein') {
    bottomHtml = renderTypeInBottom(card);
  } else if (prefs.mode === 'mc') {
    bottomHtml = renderMcBottom(card);
  } else {
    bottomHtml = renderFlipBottom(card);
  }

  const gradeRowHtml = state.revealed ? `
    <div class="mobile-grade-row">
      <button class="mobile-grade-btn tough" id="mobileToughBtn">Tough</button>
      <button class="mobile-grade-btn easy" id="mobileEasyBtn">Easy — next</button>
    </div>` : '';

  body.innerHTML = `
    <div class="mobile-nav-row">
      <button class="mobile-navlink" id="prevBtn">&lsaquo; Prev</button>
      <button class="mobile-navlink" id="nextBtn">Skip &rsaquo;</button>
    </div>
    <div class="mobile-eyebrow-row"><span class="eyebrow-chip">${escapeHtml(card.category)}</span>${resultChip}</div>
    ${defHtml}
    ${imageHtml}
    ${bottomHtml}
    ${gradeRowHtml}
  `;
  attachCardHandlers(card);
  attachMobileGradeRow(card);
}

function attachMobileGradeRow(card) {
  const toughBtn = document.getElementById('mobileToughBtn');
  const easyBtn = document.getElementById('mobileEasyBtn');
  if (toughBtn) toughBtn.addEventListener('click', () => { toggleMark(card.id, 'hard'); goNext(); });
  if (easyBtn) easyBtn.addEventListener('click', () => { toggleMark(card.id, 'easy'); goNext(); });
}

function attachCardHandlers(card) {
  const showBtn = document.getElementById('showAnswerBtn');
  if (showBtn) showBtn.addEventListener('click', () => { state.revealed = true; render(); });

  const checkBtn = document.getElementById('checkBtn');
  const typeInput = document.getElementById('typeInput');
  if (checkBtn && typeInput) {
    const doCheck = () => {
      state.typedValue = typeInput.value;
      state.typedChecked = true;
      state.typedCorrect = normalize(state.typedValue) === normalize(card.term);
      state.revealed = true;
      render();
    };
    checkBtn.addEventListener('click', doCheck);
    typeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); doCheck(); }
    });
    typeInput.addEventListener('input', (e) => { state.typedValue = e.target.value; });
    if (!isMobile()) typeInput.focus();
  }

  document.querySelectorAll('.mc-option').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      state.mc.selectedIndex = idx;
      state.revealed = true;
      render();
    });
  });

  const easyBtn = document.getElementById('easyBtn');
  const hardBtn = document.getElementById('hardBtn');
  if (easyBtn) easyBtn.addEventListener('click', () => toggleMark(card.id, 'easy'));
  if (hardBtn) hardBtn.addEventListener('click', () => toggleMark(card.id, 'hard'));

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (prevBtn) prevBtn.addEventListener('click', goPrev);
  if (nextBtn) nextBtn.addEventListener('click', goNext);
}

function toggleMark(id, type) {
  if (marks[id] === type) delete marks[id];
  else marks[id] = type;
  saveStorage();
  rebuildOrder(true);
  render();
}

function goNext() {
  if (!state.order.length) return;
  state.pos = (state.pos + 1) % state.order.length;
  resetInteraction();
  render();
}
function goPrev() {
  if (!state.order.length) return;
  state.pos = (state.pos - 1 + state.order.length) % state.order.length;
  resetInteraction();
  render();
}

function updateControlBar() {
  document.querySelectorAll('#modeSwitch button, #modeSwitchMobile button').forEach(btn => {
    btn.setAttribute('aria-selected', String(btn.getAttribute('data-mode') === prefs.mode));
  });

  const hideEasyLabel = prefs.hideEasy ? '✓ Hide easy' : 'Hide easy';
  ['hideEasyBtn', 'hideEasyBtnMobile'].forEach(id => {
    const btn = document.getElementById(id);
    btn.setAttribute('data-active', String(prefs.hideEasy));
    btn.textContent = hideEasyLabel;
  });

  const toughInPool = CARDS.filter(c => prefs.activeCategories.includes(c.category) && marks[c.id] === 'hard').length;
  const toughHtml = prefs.toughOnly
    ? `✓ Reviewing tough only <span class="count">${toughInPool}</span>`
    : `<span class="tough-dot"></span>Review tough <span class="count">${toughInPool}</span>`;
  ['toughOnlyBtn', 'toughOnlyBtnMobile'].forEach(id => {
    const btn = document.getElementById(id);
    btn.setAttribute('data-active', String(prefs.toughOnly));
    btn.innerHTML = toughHtml;
  });
}

function render() {
  renderSidebar();
  updateControlBar();

  // Mastery bar (desktop) reflects every card in the active categories —
  // including ones currently hidden from the queue by "Hide easy" — not
  // just what's in the filtered run.
  const activePool = CARDS.filter(c => prefs.activeCategories.includes(c.category));
  const activeTotal = activePool.length || 1;
  const activeKnown = activePool.filter(c => marks[c.id] === 'easy').length;
  const activeTough = activePool.filter(c => marks[c.id] === 'hard').length;
  document.getElementById('progressKnown').style.width = `${(activeKnown / activeTotal) * 100}%`;
  document.getElementById('progressTough').style.width = `${(activeTough / activeTotal) * 100}%`;

  const mobile = isMobile();
  const cardArea = document.getElementById('cardArea');
  const mobileBody = document.getElementById('mobileBody');

  if (!state.order.length) {
    let msg = 'No cards match the current filters.';
    if (prefs.toughOnly) msg = 'No cards marked tough yet — mark a few as you review.';
    else if (!prefs.activeCategories.length) msg = 'No categories selected — open Categories to pick some.';
    const emptyInner = `<h2>Nothing to review</h2><p>${msg}</p>`;

    if (mobile) {
      cardArea.innerHTML = '';
      document.getElementById('mobileCounter').textContent = '0 / 0';
      document.getElementById('mobileSegbar').innerHTML = '';
      mobileBody.innerHTML = `<div class="empty-state">${emptyInner}</div>`;
    } else {
      mobileBody.innerHTML = '';
      document.getElementById('plateCount').innerHTML = '0 <span class="of">/ 0</span>';
      document.getElementById('tally').innerHTML = '';
      cardArea.innerHTML = `<div class="card empty-state">${emptyInner}</div>`;
    }
    return;
  }

  const known = state.order.filter(id => marks[id] === 'easy').length;
  const tough = state.order.filter(id => marks[id] === 'hard').length;

  if (mobile) {
    cardArea.innerHTML = '';
    document.getElementById('mobileCounter').textContent = `${state.pos + 1} / ${state.order.length}`;
    renderMobileSegbar();
    renderMobileBody();
  } else {
    mobileBody.innerHTML = '';
    document.getElementById('plateCount').innerHTML = `${state.pos + 1} <span class="of">/ ${state.order.length}</span>`;
    document.getElementById('tally').innerHTML = `<span class="known">${known} KNOWN</span><span class="tough">${tough} TOUGH</span>`;
    renderCard();
  }
}

document.addEventListener('keydown', (e) => {
  if (editor.open) return;
  const tag = (e.target.tagName || '').toLowerCase();
  // The answer input is autofocused so cards can be graded/typed without
  // clicking in first — but that also swallows arrow-key navigation. Let
  // arrows through only while the box is still empty, so typing an answer
  // (which may itself use left/right to move the caret) isn't disrupted.
  const isEmptyAnswerInput = tag === 'input' && e.target.id === 'typeInput' && e.target.value === '';
  const arrowBypass = isEmptyAnswerInput && (e.key === 'ArrowLeft' || e.key === 'ArrowRight');
  if ((tag === 'select' || tag === 'input') && !arrowBypass) {
    if (e.key === 'Escape') closeSidebar();
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (!state.revealed && (prefs.mode === 'quick' || prefs.mode === 'imageonly')) { state.revealed = true; render(); }
    else goNext();
  } else if (e.key === 'ArrowRight') {
    goNext();
  } else if (e.key === 'ArrowLeft') {
    goPrev();
  } else if (e.key === 'Escape') {
    closeSidebar();
    closeMobileSheet();
  } else if (e.key.toLowerCase() === 's') {
    // preventDefault on these: marking/shuffling can re-render and refocus a
    // fresh (empty) answer input synchronously, and without this the browser
    // would then insert this same keystroke's character into that new box.
    e.preventDefault();
    shuffleOrder();
  } else if (e.key.toLowerCase() === 'e') {
    e.preventDefault();
    const id = state.order[state.pos];
    if (id !== undefined) toggleMark(id, 'easy');
  } else if (e.key.toLowerCase() === 'h') {
    e.preventDefault();
    const id = state.order[state.pos];
    if (id !== undefined) toggleMark(id, 'hard');
  }
});

/* ================= box editor (author-only content tool) =================
 * Not part of the normal study flow. Opened via ?edit=1 in the URL, so
 * classmates using the shared study link never see it. Lets you draw a
 * shared library of label boxes for an image (once), then walk through
 * every card that uses that image and pick which box is its answer. On
 * assignment the card becomes type "occlusion": its blockers = every other
 * box in the library (yellow), its termCss = just the selected box (green,
 * per the CSS override that already handles occlusion styling). Deleting a
 * box automatically reverts any card that pointed at it back to a plain
 * type "marker" card with no image overlay.
 * ========================================================================= */
const EDIT_MODE = new URLSearchParams(location.search).has('edit');
const EDITOR_DRAFT_KEY = 'apSkeletalLabGuide.editorDraft.v1';

let editor = {
  open: false,
  image: null,
  library: [],   // [{id, left, top, width, height}] percent coords, this image's full label set
  nextBoxId: 1,
  cardIds: [],
  idx: 0,
  selectedBoxId: null,
};
let editorDrag = null; // {x, y, rect} while drawing a new box; read by one global mouseup handler

function parseBoxDivs(html) {
  if (!html) return [];
  const out = [];
  const re = /left:\s*(-?[\d.]+)%;\s*top:\s*(-?[\d.]+)%;\s*width:\s*(-?[\d.]+)%;\s*height:\s*(-?[\d.]+)%;/g;
  let m;
  while ((m = re.exec(html))) {
    out.push({ left: +m[1], top: +m[2], width: +m[3], height: +m[4] });
  }
  return out;
}
function boxKey(b) { return [b.left, b.top, b.width, b.height].map(n => n.toFixed(2)).join(','); }

function imagesSummary() {
  const byImage = new Map();
  for (const c of CARDS) {
    if (!c.image) continue;
    if (!byImage.has(c.image)) byImage.set(c.image, { total: 0, done: 0 });
    const s = byImage.get(c.image);
    s.total++;
    if (c.type === 'occlusion' && c.termCss) s.done++;
  }
  return [...byImage.entries()]
    .map(([image, s]) => ({ image, ...s }))
    .sort((a, b) => {
      const aDone = a.done === a.total, bDone = b.done === b.total;
      if (aDone !== bDone) return aDone ? 1 : -1;
      return a.image.localeCompare(b.image);
    });
}

function buildLibraryForImage(image) {
  const seen = new Map();
  for (const c of CARDS) {
    if (c.image !== image || c.type !== 'occlusion') continue;
    // termCss holds [own target box, tiny invisible term-star badge] — only
    // the first is a real label box; the badge isn't part of the library.
    const termBoxes = parseBoxDivs(c.termCss);
    const boxes = (termBoxes.length ? [termBoxes[0]] : []).concat(parseBoxDivs(c.blockers));
    for (const b of boxes) {
      const k = boxKey(b);
      if (!seen.has(k)) seen.set(k, b);
    }
  }
  return [...seen.values()].map(b => ({ id: editor.nextBoxId++, ...b }));
}

function findCardTargetBoxKey(card) {
  if (card.type !== 'occlusion' || !card.termCss) return null;
  const boxes = parseBoxDivs(card.termCss);
  return boxes.length ? boxKey(boxes[0]) : null;
}

function currentEditorCard() { return getCardById(editor.cardIds[editor.idx]); }

function syncSelectedBoxToCard() {
  const card = currentEditorCard();
  if (!card) { editor.selectedBoxId = null; return; }
  const key = findCardTargetBoxKey(card);
  const match = key ? editor.library.find(b => boxKey(b) === key) : null;
  editor.selectedBoxId = match ? match.id : null;
}

function renderBoxDiv(b, bg) {
  return `<div style="position:absolute; left:${b.left}%; top:${b.top}%; width:${b.width}%; height:${b.height}%; background:${bg};"></div>`;
}
function renderStarDiv(b) {
  const l = b.left + b.width * 0.4, t = b.top + 0.9;
  return `<div class="term-star" style="position:absolute; left:${l.toFixed(1)}%; top:${t.toFixed(1)}%; width:2.2%; height:2.8%;"></div>`;
}

function recomputeBlockersForImage(image) {
  const siblingCards = CARDS.filter(c => c.image === image && c.type === 'occlusion' && c.termCss);
  for (const c of siblingCards) {
    const ownKey = findCardTargetBoxKey(c);
    const others = editor.library.filter(b => boxKey(b) !== ownKey);
    c.blockers = others.map(b => renderBoxDiv(b, '#ffeb3b')).join('');
  }
}

function commitAssignment(boxId) {
  const card = currentEditorCard();
  const box = editor.library.find(b => b.id === boxId);
  if (!card || !box) return;
  card.type = 'occlusion';
  card.termCss = renderBoxDiv(box, '#4caf50') + renderStarDiv(box);
  if (!card.whiteout) card.whiteout = '';
  delete card.marker;
  recomputeBlockersForImage(editor.image);
  editor.selectedBoxId = boxId;
  saveEditorDraft();
  renderEditor();
}

function clearAssignment() {
  const card = currentEditorCard();
  if (!card) return;
  card.type = 'marker';
  card.marker = '';
  delete card.termCss;
  delete card.blockers;
  delete card.whiteout;
  recomputeBlockersForImage(editor.image);
  editor.selectedBoxId = null;
  saveEditorDraft();
  renderEditor();
}

function addBoxToLibrary(box) {
  const b = { id: editor.nextBoxId++, ...box };
  editor.library.push(b);
  recomputeBlockersForImage(editor.image);
  saveEditorDraft();
  return b;
}

function removeBoxFromLibrary(boxId) {
  const box = editor.library.find(b => b.id === boxId);
  if (!box) return;
  const key = boxKey(box);
  for (const c of CARDS) {
    if (c.image !== editor.image || c.type !== 'occlusion') continue;
    if (findCardTargetBoxKey(c) === key) {
      c.type = 'marker';
      c.marker = '';
      delete c.termCss;
      delete c.blockers;
      delete c.whiteout;
    }
  }
  editor.library = editor.library.filter(b => b.id !== boxId);
  recomputeBlockersForImage(editor.image);
  if (editor.selectedBoxId === boxId) editor.selectedBoxId = null;
  saveEditorDraft();
  renderEditor();
}

function saveEditorDraft() {
  try { localStorage.setItem(EDITOR_DRAFT_KEY, JSON.stringify(CARDS)); } catch (e) { /* storage unavailable */ }
}
function loadEditorDraft() {
  try {
    const raw = localStorage.getItem(EDITOR_DRAFT_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data) && data.length === CARDS.length) {
      CARDS.length = 0;
      CARDS.push(...data);
    }
  } catch (e) { /* ignore corrupt draft */ }
}
function downloadCardsJson() {
  const blob = new Blob([JSON.stringify(CARDS)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cards.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function openEditorImage(image) {
  const summary = imagesSummary().find(s => s.image === image);
  if (summary && summary.done === summary.total) {
    const msg = 'Every card on this image is already assigned. Reopening it here ' +
      'rebuilds its box library from the existing data and will resync blocker ' +
      'boxes for all ' + summary.total + ' cards that share it — safe for cards ' +
      'built with this tool, but this image may predate it. Continue?';
    if (!confirm(msg)) return;
  }
  editor.image = image;
  editor.library = buildLibraryForImage(image);
  editor.cardIds = CARDS.filter(c => c.image === image).map(c => c.id);
  editor.idx = 0;
  syncSelectedBoxToCard();
  renderEditor();
}

function openEditor() {
  editor.open = true;
  document.getElementById('app').classList.add('editor-active');
  document.getElementById('editorRoot').style.display = 'block';
  document.getElementById('editorEntryBtn').style.display = 'none';
  editor.image = null;
  renderEditor();
}
function closeEditor() {
  editor.open = false;
  editor.image = null;
  document.getElementById('app').classList.remove('editor-active');
  document.getElementById('editorRoot').style.display = 'none';
  document.getElementById('editorEntryBtn').style.display = '';
  render();
}

function renderImagePickerRows() {
  return imagesSummary().map(s => `
    <button type="button" data-image="${escapeAttr(s.image)}" aria-pressed="${s.image === editor.image}" class="${s.done === s.total ? 'all-done' : ''}">
      <span>${escapeHtml(s.image)}</span><span class="prog">${s.done}/${s.total}</span>
    </button>`).join('');
}

function renderEditor() {
  const root = document.getElementById('editorRoot');
  root.innerHTML = editor.image ? renderEditorWorkspace() : renderEditorPicker();
  attachEditorHandlers();
}

function renderEditorPicker() {
  return `
    <div class="editor-shell">
      <div class="editor-topbar">
        <h1>Box Editor</h1>
        <span class="editor-save-note">Pick an image to draw label boxes and assign card answers.</span>
        <div style="flex:1"></div>
        <button class="tbtn" id="editorDownloadBtn">Download cards.json</button>
        <button class="tbtn" id="editorExitBtn">Exit Editor</button>
      </div>
      <div class="editor-panel" style="max-width:640px;margin:0 auto;">
        <div class="editor-image-list">${renderImagePickerRows()}</div>
      </div>
    </div>`;
}

function renderEditorWorkspace() {
  const card = currentEditorCard();
  const src = IMAGES[editor.image] || '';
  const boxesHtml = editor.library.map(b => `
    <div class="editor-box ${b.id === editor.selectedBoxId ? 'is-selected' : ''}" data-box-id="${b.id}"
      style="left:${b.left}%; top:${b.top}%; width:${b.width}%; height:${b.height}%;">
      <span class="box-del" data-del-box-id="${b.id}" title="Delete box">&times;</span>
    </div>`).join('');

  const done = !!(card && card.type === 'occlusion' && card.termCss);
  const statusHtml = card
    ? `<span class="editor-card-status ${done ? 'done' : 'pending'}">${done ? 'Assigned' : 'Needs a box'}</span>`
    : '';
  const cardPanel = card ? `
      <div class="editor-card-nav">
        <button class="pill-outline" id="editorPrevCard" ${editor.idx === 0 ? 'disabled' : ''}>&lsaquo; Prev</button>
        <span class="editor-card-count">Card ${editor.idx + 1} / ${editor.cardIds.length}</span>
        <button class="pill-outline" id="editorNextCard" ${editor.idx === editor.cardIds.length - 1 ? 'disabled' : ''}>Next &rsaquo;</button>
      </div>
      ${statusHtml}
      <div class="editor-card-cat">${escapeHtml(card.category)}</div>
      <div class="editor-card-def">${card.definition || ''}</div>
      <div class="editor-card-term">${escapeHtml(card.term)}</div>
      <div class="editor-actions">
        <button class="pill-primary" id="editorAssignBtn" ${editor.selectedBoxId ? '' : 'disabled'}>Set selected box as answer</button>
        <button class="pill-outline" id="editorClearBtn" ${done ? '' : 'disabled'}>Clear this card's assignment</button>
      </div>
    ` : '<p class="editor-hint">No cards use this image.</p>';

  return `
    <div class="editor-shell">
      <div class="editor-topbar">
        <h1>Box Editor — ${escapeHtml(editor.image)}</h1>
        <span class="editor-save-note">Autosaved to this browser as you go.</span>
        <div style="flex:1"></div>
        <button class="tbtn" id="editorDownloadBtn">Download cards.json</button>
        <button class="tbtn" id="editorExitBtn">Exit Editor</button>
      </div>
      <div class="editor-body">
        <div class="editor-panel">
          <div class="editor-image-list">${renderImagePickerRows()}</div>
        </div>
        <div>
          <div class="editor-canvas-wrap" id="editorCanvas">
            <img src="${src}" alt="">
            ${boxesHtml}
          </div>
          <p class="editor-hint">Click-drag on the image to draw a new box. Click a box to select it, then "Set selected box as answer". Click &times; to delete a box.</p>
        </div>
        <div class="editor-panel">${cardPanel}</div>
      </div>
    </div>`;
}

function attachEditorHandlers() {
  document.getElementById('editorDownloadBtn').addEventListener('click', downloadCardsJson);
  document.getElementById('editorExitBtn').addEventListener('click', closeEditor);
  document.querySelectorAll('#editorRoot .editor-image-list button').forEach(btn => {
    btn.addEventListener('click', () => openEditorImage(btn.dataset.image));
  });

  const canvas = document.getElementById('editorCanvas');
  if (!canvas) return;

  canvas.querySelectorAll('.editor-box').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('box-del')) return;
      editor.selectedBoxId = Number(el.dataset.boxId);
      renderEditor();
    });
  });
  canvas.querySelectorAll('.box-del').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('Delete this box? Any card currently targeting it reverts to an unassigned card.')) {
        removeBoxFromLibrary(Number(el.dataset.delBoxId));
      }
    });
  });

  canvas.addEventListener('mousedown', (e) => {
    if (e.target.closest('.editor-box')) return;
    editorDrag = { x: e.clientX, y: e.clientY, rect: canvas.getBoundingClientRect() };
    const marker = document.createElement('div');
    marker.className = 'editor-draw-rect';
    marker.id = 'editorDrawRect';
    canvas.appendChild(marker);
  });

  document.getElementById('editorPrevCard')?.addEventListener('click', () => { editor.idx--; syncSelectedBoxToCard(); renderEditor(); });
  document.getElementById('editorNextCard')?.addEventListener('click', () => { editor.idx++; syncSelectedBoxToCard(); renderEditor(); });
  document.getElementById('editorAssignBtn')?.addEventListener('click', () => commitAssignment(editor.selectedBoxId));
  document.getElementById('editorClearBtn')?.addEventListener('click', clearAssignment);
}

if (EDIT_MODE) {
  loadEditorDraft();
  const entryBtn = document.createElement('button');
  entryBtn.className = 'pill-primary editor-entry-btn';
  entryBtn.id = 'editorEntryBtn';
  entryBtn.textContent = 'Edit Boxes';
  entryBtn.addEventListener('click', openEditor);
  document.body.appendChild(entryBtn);

  // Registered once (not per-render) since these track a drag that can
  // continue past the canvas element being replaced by the next renderEditor().
  document.addEventListener('mousemove', (e) => {
    if (!editorDrag) return;
    const marker = document.getElementById('editorDrawRect');
    if (!marker) return;
    const r = editorDrag.rect;
    const x0 = Math.min(editorDrag.x, e.clientX), x1 = Math.max(editorDrag.x, e.clientX);
    const y0 = Math.min(editorDrag.y, e.clientY), y1 = Math.max(editorDrag.y, e.clientY);
    marker.style.left = (x0 - r.left) + 'px';
    marker.style.top = (y0 - r.top) + 'px';
    marker.style.width = (x1 - x0) + 'px';
    marker.style.height = (y1 - y0) + 'px';
  });
  document.addEventListener('mouseup', (e) => {
    if (!editorDrag) return;
    const r = editorDrag.rect;
    document.getElementById('editorDrawRect')?.remove();
    const x0 = Math.min(editorDrag.x, e.clientX), x1 = Math.max(editorDrag.x, e.clientX);
    const y0 = Math.min(editorDrag.y, e.clientY), y1 = Math.max(editorDrag.y, e.clientY);
    editorDrag = null;
    const w = x1 - x0, h = y1 - y0;
    if (w < 6 || h < 6) return;
    const box = {
      left: +(((x0 - r.left) / r.width) * 100).toFixed(2),
      top: +(((y0 - r.top) / r.height) * 100).toFixed(2),
      width: +((w / r.width) * 100).toFixed(2),
      height: +((h / r.height) * 100).toFixed(2),
    };
    const created = addBoxToLibrary(box);
    editor.selectedBoxId = created.id;
    renderEditor();
  });
}

rebuildOrder(false);
render();
</script>
</body>
</html>
